version: '3.8'

services:
  test-db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=oi_lend_me_test
    tmpfs:
      - /var/lib/postgresql/data  # No persistence — clean on every restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d oi_lend_me_test"]
      interval: 3s
      timeout: 3s
      retries: 5
