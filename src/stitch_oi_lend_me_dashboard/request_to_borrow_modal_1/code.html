<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4d9dff",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1823",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glass-panel {
            background: rgba(23, 33, 46, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .urgent-glow:has(:checked) {
            box-shadow: 0 0 20px rgba(77, 157, 255, 0.4);
            border-color: #4d9dff;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
<!-- Blurred Background (Item Detail Page Mockup) -->
<div class="fixed inset-0 z-0 flex flex-col blur-md grayscale-[0.2]">
<header class="flex items-center justify-between border-b border-solid border-white/10 px-40 py-3 bg-background-dark">
<div class="flex items-center gap-8">
<div class="flex items-center gap-4 text-white">
<div class="size-6 text-primary">
<span class="material-symbols-outlined">handshake</span>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-tight">Oi! Lend Me</h2>
</div>
</div>
</header>
<main class="flex-1 px-40 py-10 flex gap-10">
<div class="w-1/2 aspect-square bg-white/5 rounded-xl flex items-center justify-center">
<img class="w-full h-full object-cover rounded-xl opacity-50" data-alt="High-end professional camera on a wooden table" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9T_FS9SZP_GvLL1I4f8OLgot69DKP30CKojJSIIAFPzb5haO3L9KSQ5FAPyOjMiB7SrrbZkKs5WqCKppSuxLNzvm1IlRL2nfewnK21rfzDI-MwKbIDWZfEdk42ir8PtCCd2aA-FT3unJqf1MGrFYbGEG11vmqngkdNAu6tMffYYIljFq9bjhlEFtB1fgRMCiRAmi2lwsFhozIouC5SqHLpL-v0QpjCg1OIQJZdQApNyxWCJBZezwLSZGVuTRXdaqaoDAsSOfRVLf2"/>
</div>
<div class="w-1/2 space-y-6">
<div class="h-10 w-48 bg-white/10 rounded"></div>
<div class="h-6 w-full bg-white/5 rounded"></div>
<div class="h-6 w-3/4 bg-white/5 rounded"></div>
</div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
<!-- Modal Container -->
<div class="glass-panel relative flex h-full max-h-[850px] w-full max-w-[640px] flex-col overflow-hidden rounded-xl shadow-2xl">
<!-- Close Button -->
<button class="absolute right-6 top-6 z-10 text-white/60 hover:text-white transition-colors">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
<!-- Content Container -->
<div class="flex flex-col flex-1 overflow-y-auto custom-scrollbar">
<!-- Headline -->
<div class="pt-12 pb-4">
<h1 class="text-white tracking-tight text-[32px] font-bold leading-tight px-8 text-center">Oi! When are you bringing it back? 🤝</h1>
<p class="text-[#9aa9bc] text-center px-8 mt-2">Choose your return date or set a quick duration.</p>
</div>
<!-- Calendar Section -->
<div class="px-8 pb-4">
<div class="flex flex-col gap-0.5 rounded-xl bg-white/5 p-4 border border-white/5">
<div class="flex items-center p-1 justify-between mb-2">
<button class="hover:bg-white/10 rounded-full p-2 transition-colors">
<span class="material-symbols-outlined text-white">chevron_left</span>
</button>
<p class="text-white text-base font-bold leading-tight flex-1 text-center">October 2023</p>
<button class="hover:bg-white/10 rounded-full p-2 transition-colors">
<span class="material-symbols-outlined text-white">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 text-center">
<p class="text-white/40 text-[13px] font-bold leading-normal tracking-wider h-10 flex items-center justify-center">S</p>
<p class="text-white/40 text-[13px] font-bold leading-normal tracking-wider h-10 flex items-center justify-center">M</p>
<p class="text-white/40 text-[13px] font-bold leading-normal tracking-wider h-10 flex items-center justify-center">T</p>
<p class="text-white/40 text-[13px] font-bold leading-normal tracking-wider h-10 flex items-center justify-center">W</p>
<p class="text-white/40 text-[13px] font-bold leading-normal tracking-wider h-10 flex items-center justify-center">T</p>
<p class="text-white/40 text-[13px] font-bold leading-normal tracking-wider h-10 flex items-center justify-center">F</p>
<p class="text-white/40 text-[13px] font-bold leading-normal tracking-wider h-10 flex items-center justify-center">S</p>
<!-- Calendar Days -->
<button class="h-12 w-full text-white/30 col-start-4 text-sm font-medium">1</button>
<button class="h-12 w-full text-white/30 text-sm font-medium">2</button>
<button class="h-12 w-full text-white/30 text-sm font-medium">3</button>
<button class="h-12 w-full text-white/30 text-sm font-medium">4</button>
<button class="h-12 w-full text-white relative flex items-center justify-center group">
<div class="absolute inset-0 bg-primary/20 rounded-l-full"></div>
<div class="relative z-10 flex size-10 items-center justify-center rounded-full bg-primary text-background-dark font-bold shadow-[0_0_15px_rgba(77,157,255,0.4)]">5</div>
</button>
<button class="h-12 w-full bg-primary/20 text-white text-sm font-medium">6</button>
<button class="h-12 w-full bg-primary/20 text-white text-sm font-medium">7</button>
<button class="h-12 w-full bg-primary/20 text-white text-sm font-medium">8</button>
<button class="h-12 w-full bg-primary/20 text-white text-sm font-medium relative flex items-center justify-center">
<div class="absolute inset-0 bg-primary/20 rounded-r-full"></div>
<div class="relative z-10">9</div>
</button>
<button class="h-12 w-full text-white text-sm font-medium hover:bg-white/10 rounded-full transition-colors">10</button>
<button class="h-12 w-full text-white text-sm font-medium hover:bg-white/10 rounded-full transition-colors">11</button>
<!-- ...rest of days -->
</div>
</div>
</div>
<!-- Slider -->
<div class="px-8 pb-4">
<div class="relative flex w-full flex-col items-start justify-between gap-3 p-4 bg-white/5 border border-white/5 rounded-xl">
<div class="flex w-full shrink-[3] items-center justify-between">
<p class="text-white text-base font-medium leading-normal">Or select duration</p>
<p class="text-primary text-lg font-bold leading-normal">3 days</p>
</div>
<div class="flex h-6 w-full items-center gap-4">
<div class="flex h-1.5 flex-1 rounded-full bg-white/10 overflow-visible relative">
<div class="h-full w-[32%] rounded-full bg-primary shadow-[0_0_10px_rgba(77,157,255,0.6)]"></div>
<div class="absolute left-[32%] top-1/2 -translate-y-1/2 -translate-x-1/2">
<div class="size-5 rounded-full bg-white border-2 border-primary cursor-pointer hover:scale-110 transition-transform shadow-lg"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Urgent Toggle -->
<div class="px-8 pb-6">
<div class="urgent-glow flex flex-1 flex-col items-start justify-between gap-4 rounded-xl border border-white/10 bg-white/5 p-5 transition-all duration-300 sm:flex-row sm:items-center">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">bolt</span>
<p class="text-white text-base font-bold leading-tight uppercase tracking-widest text-sm">Mark as Urgent</p>
</div>
<p class="text-[#9aa9bc] text-sm font-normal leading-normal">Let the owner know you need it ASAP. Glows when active.</p>
</div>
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-white/10 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary transition-all">
<div class="h-full w-[27px] rounded-full bg-white shadow-lg"></div>
<input checked="" class="invisible absolute peer" type="checkbox"/>
</label>
</div>
</div>
</div>
<!-- Footer Action -->
<div class="p-8 border-t border-white/10 bg-white/5">
<button class="w-full flex h-14 cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-primary text-background-dark gap-2 text-lg font-extrabold leading-normal tracking-wide transition-all hover:brightness-110 active:scale-[0.98] shadow-[0_8px_30px_rgb(77,157,255,0.3)]">
<span>Send Borrow Request</span>
<span class="material-symbols-outlined font-bold">send</span>
</button>
<p class="text-center text-[#9aa9bc] text-xs mt-4">The owner will be notified immediately.</p>
</div>
</div>
</div>
</body></html>
