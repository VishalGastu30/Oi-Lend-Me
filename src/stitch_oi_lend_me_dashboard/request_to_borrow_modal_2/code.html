<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4d9dff",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0b1219",
                        "glass-white": "rgba(255, 255, 255, 0.05)",
                        "glass-border": "rgba(255, 255, 255, 0.1)",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer components {
            .modal-shell {
                @apply fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto backdrop-blur-md bg-black/70;
            }
            .glass-card {
                @apply bg-[#131b26]/80 backdrop-blur-2xl border border-glass-border shadow-[0_20px_50px_rgba(0,0,0,0.5)];
            }
            .input-group {
                @apply bg-glass-white border border-glass-border rounded-2xl p-5 transition-all duration-300;
            }
            .toggle-track {
                @apply relative h-8 w-14 cursor-pointer rounded-full bg-white/10 p-1 transition-all duration-300;
            }
            .toggle-thumb {
                @apply h-6 w-6 rounded-full bg-white shadow-lg transition-all duration-300 transform;
            }
            input:checked ~ .toggle-track {
                @apply bg-primary;
            }
            input:checked ~ .toggle-track .toggle-thumb {
                @apply translate-x-6;
            }
            .urgent-glow:has(input:checked) {
                @apply border-primary/50 bg-primary/5 shadow-[0_0_25px_rgba(77,157,255,0.15)];
            }
            .custom-range::-webkit-slider-thumb {
                @apply appearance-none w-6 h-6 rounded-full bg-white border-4 border-primary shadow-[0_0_15px_rgba(77,157,255,0.5)] cursor-pointer hover:scale-110 transition-transform;
            }
            .custom-range::-moz-range-thumb {
                @apply w-6 h-6 rounded-full bg-white border-4 border-primary shadow-[0_0_15px_rgba(77,157,255,0.5)] cursor-pointer hover:scale-110 transition-transform border-none;
            }
        }
    </style>
</head>
<body class="bg-background-dark font-display text-white selection:bg-primary/30">
<div class="fixed inset-0 z-0 flex flex-col blur-xl grayscale-[0.3] opacity-40">
<header class="flex items-center justify-between border-b border-white/10 px-40 py-6 bg-background-dark">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-3xl">handshake</span>
<h2 class="text-xl font-extrabold tracking-tight">Oi! Lend Me</h2>
</div>
</header>
<main class="flex-1 px-40 py-12 flex gap-12">
<div class="w-1/2 aspect-square bg-white/10 rounded-3xl overflow-hidden">
<img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9T_FS9SZP_GvLL1I4f8OLgot69DKP30CKojJSIIAFPzb5haO3L9KSQ5FAPyOjMiB7SrrbZkKs5WqCKppSuxLNzvm1IlRL2nfewnK21rfzDI-MwKbIDWZfEdk42ir8PtCCd2aA-FT3unJqf1MGrFYbGEG11vmqngkdNAu6tMffYYIljFq9bjhlEFtB1fgRMCiRAmi2lwsFhozIouC5SqHLpL-v0QpjCg1OIQJZdQApNyxWCJBZezwLSZGVuTRXdaqaoDAsSOfRVLf2"/>
</div>
<div class="w-1/2 space-y-8">
<div class="h-12 w-64 bg-white/10 rounded-lg"></div>
<div class="h-4 w-full bg-white/5 rounded-full"></div>
<div class="h-4 w-3/4 bg-white/5 rounded-full"></div>
</div>
</main>
</div>
<div class="modal-shell">
<div class="glass-card relative flex w-full max-w-[580px] flex-col overflow-hidden rounded-[2.5rem]">
<button class="absolute right-8 top-8 z-20 size-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-white/60 hover:text-white transition-all">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<div class="flex flex-col flex-1 overflow-y-auto px-8 pt-14 pb-8">
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center size-14 bg-primary/10 rounded-2xl mb-6">
<span class="material-symbols-outlined text-primary text-3xl">calendar_today</span>
</div>
<h1 class="text-white text-3xl font-extrabold leading-tight tracking-tight px-4">
                        Oi! When are you bringing it back? 🤝
                    </h1>
<p class="text-[#9aa9bc] mt-3 text-base">Select your return date and keep things smooth.</p>
</div>
<div class="space-y-4 mb-6">
<div class="input-group !p-6">
<div class="flex items-center justify-between mb-6">
<button class="size-10 flex items-center justify-center hover:bg-white/5 rounded-xl transition-colors">
<span class="material-symbols-outlined text-white/60">chevron_left</span>
</button>
<p class="text-white text-lg font-bold">October 2023</p>
<button class="size-10 flex items-center justify-center hover:bg-white/5 rounded-xl transition-colors">
<span class="material-symbols-outlined text-white/60">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 mb-2">
<p class="text-white/30 text-xs font-bold uppercase tracking-widest text-center">Sun</p>
<p class="text-white/30 text-xs font-bold uppercase tracking-widest text-center">Mon</p>
<p class="text-white/30 text-xs font-bold uppercase tracking-widest text-center">Tue</p>
<p class="text-white/30 text-xs font-bold uppercase tracking-widest text-center">Wed</p>
<p class="text-white/30 text-xs font-bold uppercase tracking-widest text-center">Thu</p>
<p class="text-white/30 text-xs font-bold uppercase tracking-widest text-center">Fri</p>
<p class="text-white/30 text-xs font-bold uppercase tracking-widest text-center">Sat</p>
</div>
<div class="grid grid-cols-7 gap-y-1">
<div class="h-12 flex items-center justify-center text-white/10 font-medium">28</div>
<div class="h-12 flex items-center justify-center text-white/10 font-medium">29</div>
<div class="h-12 flex items-center justify-center text-white/10 font-medium">30</div>
<div class="h-12 flex items-center justify-center text-white/40 font-medium">1</div>
<div class="h-12 flex items-center justify-center text-white/40 font-medium">2</div>
<div class="h-12 flex items-center justify-center text-white/40 font-medium">3</div>
<div class="h-12 flex items-center justify-center text-white/40 font-medium">4</div>
<div class="h-12 relative flex items-center justify-center group cursor-pointer">
<div class="absolute inset-y-1 left-1/2 right-0 bg-primary/20 rounded-l-full"></div>
<div class="relative z-10 size-10 flex items-center justify-center rounded-full bg-primary text-background-dark font-black shadow-[0_0_20px_rgba(77,157,255,0.4)]">5</div>
</div>
<div class="h-12 relative flex items-center justify-center bg-primary/20 my-1 cursor-pointer">
<span class="relative z-10 text-white font-bold">6</span>
</div>
<div class="h-12 relative flex items-center justify-center bg-primary/20 my-1 cursor-pointer">
<span class="relative z-10 text-white font-bold">7</span>
</div>
<div class="h-12 relative flex items-center justify-center bg-primary/20 my-1 cursor-pointer">
<span class="relative z-10 text-white font-bold">8</span>
</div>
<div class="h-12 relative flex items-center justify-center group cursor-pointer">
<div class="absolute inset-y-1 left-0 right-1/2 bg-primary/20 rounded-r-full"></div>
<div class="relative z-10 size-10 flex items-center justify-center rounded-full bg-primary/30 text-white font-bold border-2 border-primary/50">9</div>
</div>
<div class="h-12 flex items-center justify-center text-white hover:bg-white/5 rounded-full transition-colors cursor-pointer font-medium">10</div>
<div class="h-12 flex items-center justify-center text-white hover:bg-white/5 rounded-full transition-colors cursor-pointer font-medium">11</div>
</div>
</div>
</div>
<div class="mb-6">
<div class="input-group">
<div class="flex items-center justify-between mb-5">
<span class="text-white font-semibold">Quick Duration</span>
<div class="px-3 py-1 bg-primary/20 border border-primary/30 rounded-full">
<span class="text-primary font-bold text-sm tracking-wide">3 DAYS</span>
</div>
</div>
<div class="relative w-full h-6 flex items-center">
<div class="absolute h-2 w-full bg-white/10 rounded-full"></div>
<div class="absolute h-2 w-1/3 bg-primary rounded-full shadow-[0_0_15px_rgba(77,157,255,0.4)]"></div>
<input class="absolute w-full h-2 opacity-0 cursor-pointer z-20 custom-range" max="14" min="1" type="range" value="3"/>
</div>
<div class="flex justify-between mt-4">
<span class="text-xs font-bold text-white/30">1 DAY</span>
<span class="text-xs font-bold text-white/30">14 DAYS</span>
</div>
</div>
</div>
<div class="mb-10">
<label class="urgent-glow input-group flex items-center justify-between cursor-pointer group">
<div class="flex items-center gap-4">
<div class="size-12 rounded-2xl bg-primary/10 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary">bolt</span>
</div>
<div>
<h3 class="text-white font-bold tracking-tight">Mark as Urgent</h3>
<p class="text-[#9aa9bc] text-sm">Owner gets a priority alert</p>
</div>
</div>
<div class="relative">
<input checked="" class="sr-only" type="checkbox"/>
<div class="toggle-track">
<div class="toggle-thumb"></div>
</div>
</div>
</label>
</div>
<div class="space-y-4">
<button class="w-full h-16 bg-primary hover:bg-[#60abff] text-background-dark font-black text-lg rounded-2xl flex items-center justify-center gap-3 shadow-[0_12px_40px_rgba(77,157,255,0.3)] transition-all active:scale-[0.98] group">
<span>Send Borrow Request</span>
<span class="material-symbols-outlined font-bold group-hover:translate-x-1 transition-transform">send</span>
</button>
<p class="text-center text-white/40 text-xs font-medium uppercase tracking-[0.2em]">
                        Respect the gear • Return on time
                    </p>
</div>
</div>
</div>
</div>

</body></html>
